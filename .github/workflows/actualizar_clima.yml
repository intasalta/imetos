name: Actualizar Datos FieldClimate

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  descargar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install chromium

      - name: Ejecutar script de descarga
        env:
          FC_USER: ${{ secrets.FC_USER }}
          FC_PASS: ${{ secrets.FC_PASS }}
        run: |
          python descargar_clima.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *_station_data.xls
          git commit -m "Actualización automática de estaciones meteorológicas [skip ci]" || echo "No hay cambios para commitear"
          git push
